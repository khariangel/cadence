<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cadence</title>
<meta name="description" content="Cadence, a numbered series by Khari Angel.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root { --bg:#f2eee6; --ink:#1d1c19; --muted:#6c675e; --rule:#d3ccbf; --afterglow:#a65a24; --grain-opacity:.07; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#141310; --ink:#ece6db; --muted:#9d968a; --rule:#37342d; --afterglow:#d9925a; --grain-opacity:.09; } }
:root[data-theme="dark"] { --bg:#141310; --ink:#ece6db; --muted:#9d968a; --rule:#37342d; --afterglow:#d9925a; --grain-opacity:.09; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:400 17px/1.65 "Hanken Grotesk", system-ui, sans-serif; letter-spacing:-0.005em; }
body::before { content:""; position:fixed; inset:0; pointer-events:none; opacity:var(--grain-opacity); z-index:10;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
.wrap { max-width:960px; margin:0 auto; padding:0 16px; }
@media (min-width:720px) { .wrap { padding:0 32px; } }
.label { font-size:11px; font-weight:500; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }
.serif { font-family:"Instrument Serif", Georgia, serif; font-style:italic; font-weight:400; letter-spacing:0; }
hr { border:0; border-top:1px solid var(--rule); margin:0; }
header { padding:56px 0 40px; }
header .top { display:flex; justify-content:space-between; align-items:baseline; gap:16px; margin-bottom:48px; }
h1 { font-weight:500; font-size:clamp(40px,8vw,76px); line-height:.98; letter-spacing:-0.035em; margin:0 0 28px; }
h1 .serif { font-size:1.08em; }
.intro p { max-width:620px; font-size:19px; margin:0 0 16px; }
section { padding:40px 0; }
section p { max-width:620px; margin:0 0 16px; }
.sec-head { display:flex; gap:16px; align-items:baseline; margin-bottom:20px; }
.sec-head .num { font-family:"Instrument Serif", Georgia, serif; font-style:italic; font-size:22px; color:var(--muted); min-width:28px; }
h2 { font-weight:500; font-size:26px; letter-spacing:-0.02em; margin:0; }
section p, section .sec-head ~ * { margin-left:0; }
@media (min-width:720px) { section p { margin-left:44px; } }
a { color:var(--afterglow); text-underline-offset:3px; }
footer { padding:32px 0 64px; }
a.label { color:var(--muted); text-decoration:none; }
a.label:hover { color:var(--ink); }

.entries { list-style:none; margin:0; padding:0; border-top:1px solid var(--rule); }
.entries li { border-bottom:1px solid var(--rule); }
.entries a { display:flex; gap:16px; align-items:baseline; padding:24px 0; color:var(--ink); text-decoration:none; }
.entries a:hover h2 { color:var(--afterglow); }
.entries .num { font-family:"Instrument Serif", Georgia, serif; font-style:italic; font-size:22px; color:var(--muted); min-width:28px; }
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="top"><span class="label">Series</span><span class="label">Khari Angel</span></div>
  <h1>Cadence</h1>
</header>
<ul class="entries">
  <li><a href="01/"><span class="num">01</span><h2>Money turns into tokens. <span class="serif">Then what?</span></h2></a></li>
</ul>
<section><p style="margin-left:0">Free tool: the <a href="https://cadence-calculator.vercel.app">Cadence Calculator</a>.</p></section>
</div>
</body>
</html>
